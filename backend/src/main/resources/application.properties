spring.application.name=stockpulse
server.port=8080

# H2 In-Memory DB
spring.datasource.url=jdbc:h2:mem:stockpulsedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate-specific settings for BigDecimal handling
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.hbm2ddl.enable_lazy_queue=false

# Strategy & AI Configuration
stockpulse.commerce.strategy=rule
llm.provider=gemini
llm.api-key=${LLM_API_KEY:}
llm.model=gemini-1.5-flash
llm.base-url=https://generativelanguage.googleapis.com

# Commerce Advisor Configuration
commerce.advisor.strategy=rule-based